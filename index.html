<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemesis UMU - Terminal</title>
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <!-- MOTOR 3D (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            background-color: #000;
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #33ff33; font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden;
        }

        #fondo-espacial {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }

        body::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(51, 255, 51, 0.04) 2px, rgba(51, 255, 51, 0.04) 4px);
            pointer-events: none; z-index: 20;
        }

        .contenedor {
            background-color: rgba(5, 5, 5, 0.85); backdrop-filter: blur(4px);
            padding: 30px; border: 1px solid rgba(51, 255, 51, 0.6);
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.2), inset 0 0 15px rgba(51, 255, 51, 0.1);
            text-align: center; width: 320px; position: relative; z-index: 10;
        }

        .contenedor::before {
            content: "SISTEMA MU-TH-UR 6000"; position: absolute; top: -10px; left: 10px;
            background: #000; padding: 0 10px; font-size: 12px; color: #33ff33; border: 1px solid #33ff33;
        }

        h2 {
            text-transform: uppercase; letter-spacing: 2px; font-weight: normal; 
            border-bottom: 1px dashed #33ff33; padding-bottom: 10px; margin-top: 5px;
        }

        input {
            width: 90%; padding: 10px; margin: 10px 0; background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(51, 255, 51, 0.5); color: #33ff33; 
            font-family: 'Courier New', Courier, monospace; font-size: 16px; box-sizing: border-box; outline: none;
        }

        button {
            width: 100%; padding: 12px; background-color: #000; color: #33ff33;
            border: 1px solid #33ff33; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px 0; text-transform: uppercase; transition: all 0.2s;
        }

        button:hover { background-color: rgba(51, 255, 51, 0.2); box-shadow: 0 0 15px rgba(51, 255, 51, 0.5); }
        .texto-secundario { font-size: 12px; color: rgba(51, 255, 51, 0.6); margin: 15px 0; }
        .codigo-destacado { font-size: 36px; font-weight: bold; color: #fff; text-shadow: 0 0 12px #33ff33; letter-spacing: 8px; margin: 15px 0; }
        #lista-jugadores { list-style: none; padding: 0; margin-top: 15px; text-align: left; border: 1px solid rgba(51, 255, 51, 0.3); padding: 10px; min-height: 100px; background-color: rgba(0, 0, 0, 0.6); }
        #lista-jugadores li::before { content: "> "; }

        /* NUEVO: Contenedor Pantalla Completa para el Juego 3D */
        #pantalla-juego {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 100; display: none; margin: 0; padding: 0;
        }
        
        #tablero-juego {
            width: 100%; height: 100%; cursor: crosshair;
        }

        #ui-juego {
            position: absolute; top: 20px; left: 20px; z-index: 101; pointer-events: none;
        }

        #instrucciones-3d {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85); border: 1px solid #33ff33;
            padding: 30px; text-align: center; z-index: 102; box-shadow: 0 0 20px rgba(51, 255, 51, 0.3);
            pointer-events: none;
        }

        /* Mirilla en el centro de la pantalla */
        #mirilla {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background-color: rgba(255,255,255,0.5); border-radius: 50%;
            z-index: 101; pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="fondo-espacial"></canvas>

    <!-- MENÚ PRINCIPAL Y SALAS DE ESPERA -->
    <div class="contenedor" id="menu-principal">
        <h2>Acceso a Tripulación</h2>
        <input type="text" id="nombre-jugador" placeholder="IDENTIFICACIÓN" required autocomplete="off">
        <button onclick="crearSala()">INICIAR PROTOCOLO (Crear)</button>
        <div class="texto-secundario">--- O ACCEDE A UNA NAVE ---</div>
        <input type="text" id="codigo-input" placeholder="CÓDIGO DE ENLACE" maxlength="5" autocomplete="off">
        <button onclick="unirseSala()">CONECTAR</button>
    </div>

    <div class="contenedor" id="sala-espera" style="display: none;">
        <h2>Protocolo Activo</h2>
        <p class="texto-secundario">CÓDIGO DE ENLACE TRANSMITIDO:</p>
        <div class="codigo-destacado" id="mostrar-codigo"></div>
        <p class="texto-secundario" style="text-align: left; margin-bottom: 5px;">TRIPULACIÓN DETECTADA:</p>
        <ul id="lista-jugadores"></ul>
        <button style="margin-top: 20px;" onclick="empezarJuego()" id="btn-empezar" style="display:none;">DESPERTAR DEL HIPERSUEÑO</button>
    </div>

    <div class="contenedor" id="pantalla-seleccion" style="display: none;">
        <h2>Asignación de Roles</h2>
        <div id="area-seleccion" style="margin-top: 20px;"></div>
        <div id="resumen-elecciones" style="margin-top: 20px; font-size: 12px; text-align: left; border-top: 1px dashed #33ff33; padding-top: 10px;"></div>
    </div>

    <!-- PANTALLA COMPLETA 3D -->
    <div id="pantalla-juego">
        <div id="ui-juego">
            <h3 style="margin:0; border-bottom: 1px solid #33ff33;">SALA PRINCIPAL - SECTOR 1</h3>
            <p id="info-rol" class="texto-secundario" style="margin: 5px 0;"></p>
        </div>
        
        <div id="instrucciones-3d">
            <h2 style="margin-top:0;">INICIANDO SOPORTE VITAL</h2>
            <p>HAZ CLIC EN CUALQUIER PARTE PARA ENTRAR</p>
            <p class="texto-secundario">Moverse: W A S D | Mirar: Ratón</p>
        </div>
        
        <div id="mirilla"></div>
        <div id="tablero-juego"></div>
    </div>

    <script>
        // --- ANIMACIÓN DEL ESPACIO (Fondo 2D) ---
        const imgAsteroide = new Image();
        imgAsteroide.src = 'asteroide.com.png'; 
        const canvasFondo = document.getElementById('fondo-espacial');
        const ctxFondo = canvasFondo.getContext('2d');
        
        function redimensionarFondo() { canvasFondo.width = window.innerWidth; canvasFondo.height = window.innerHeight; }
        window.addEventListener('resize', redimensionarFondo); redimensionarFondo();

        const estrellas = [];
        for (let i = 0; i < 150; i++) {
            estrellas.push({ x: Math.random() * canvasFondo.width, y: Math.random() * canvasFondo.height, radio: Math.random() * 1.2 + 0.3, velocidad: Math.random() * 0.15 + 0.05, opacidad: Math.random(), cambioOpacidad: (Math.random() * 0.01 + 0.005) * (Math.random() < 0.5 ? 1 : -1) });
        }
        const asteroides = [];

        function dibujarEspacio() {
            ctxFondo.clearRect(0, 0, canvasFondo.width, canvasFondo.height);
            estrellas.forEach(e => {
                e.opacidad += e.cambioOpacidad; if(e.opacidad <= 0.1) { e.opacidad = 0.1; e.cambioOpacidad *= -1; } if(e.opacidad >= 1) { e.opacidad = 1; e.cambioOpacidad *= -1; }
                ctxFondo.fillStyle = `rgba(255, 255, 255, ${e.opacidad})`; ctxFondo.beginPath(); ctxFondo.arc(e.x, e.y, e.radio, 0, Math.PI * 2); ctxFondo.fill();
                e.x -= e.velocidad; if (e.x < 0) { e.x = canvasFondo.width; e.y = Math.random() * canvasFondo.height; }
            });

            if (imgAsteroide.complete && Math.random() < 0.05) {
                asteroides.push({ x: canvasFondo.width + 150, y: Math.random() * canvasFondo.height, velocidad: Math.random() * 1 + 0.3, tamaño: Math.random() * 150 + 80, rotacion: Math.random() * Math.PI * 2, velRotacion: (Math.random() - 0.5) * 0.02 });
            }

            for (let i = asteroides.length - 1; i >= 0; i--) {
                let obj = asteroides[i]; obj.x -= obj.velocidad; obj.rotacion += obj.velRotacion;
                ctxFondo.save(); ctxFondo.translate(obj.x, obj.y); ctxFondo.rotate(obj.rotacion);
                ctxFondo.drawImage(imgAsteroide, -obj.tamaño / 2, -obj.tamaño / 2, obj.tamaño, obj.tamaño); ctxFondo.restore();
                if (obj.x < -300) asteroides.splice(i, 1);
            }
            requestAnimationFrame(dibujarEspacio);
        }
        dibujarEspacio();

        // --- LÓGICA DE FIREBASE ---
        const firebaseConfig = { databaseURL: "https://nemesis-54598-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let miSalaActual = "";
        let miNombre = ""; 
        let miPersonajeAsignado = ""; 

        const coloresPersonajes = {
            "Soldado": "#ff3333", "Capitán": "#3366ff", "Explorador": "#9933ff",
            "Ingeniero": "#ff9933", "Científico": "#aaaaaa", "Piloto": "#33ff33"
        };

        function generarCodigo() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let res = '';
            for (let i = 0; i < 5; i++) res += caracteres.charAt(Math.floor(Math.random() * caracteres.length)); return res;
        }

        function crearSala() {
            miNombre = document.getElementById('nombre-jugador').value.trim();
            if (!miNombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");
            const codigo = generarCodigo(); miSalaActual = codigo;
            db.ref('salas/' + codigo).set({ creador: miNombre, estado: 'esperando', jugadores: { [miNombre]: "Sin asignar" } });
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('sala-espera').style.display = 'block';
            document.getElementById('mostrar-codigo').innerText = codigo;
            document.getElementById('btn-empezar').style.display = 'block'; 
            escucharCambiosSala(codigo);
        }

        function unirseSala() {
            miNombre = document.getElementById('nombre-jugador').value.trim();
            const codigo = document.getElementById('codigo-input').value.toUpperCase();
            if (!miNombre || codigo.length !== 5) return alert("ERROR EN CREDENCIALES.");
            db.ref('salas/' + codigo).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    miSalaActual = codigo;
                    db.ref('salas/' + codigo + '/jugadores').update({ [miNombre]: "Sin asignar" });
                    document.getElementById('menu-principal').style.display = 'none';
                    document.getElementById('sala-espera').style.display = 'block';
                    document.getElementById('mostrar-codigo').innerText = codigo;
                    document.getElementById('btn-empezar').style.display = 'none'; 
                    escucharCambiosSala(codigo);
                } else alert("NAVE NO ENCONTRADA.");
            });
        }

        function empezarJuego() {
            db.ref('salas/' + miSalaActual + '/jugadores').once('value').then((snapshot) => {
                const lista = Object.keys(snapshot.val());
                let disp = ["Soldado", "Capitán", "Explorador", "Ingeniero", "Científico", "Piloto"].sort(() => Math.random() - 0.5);
                db.ref('salas/' + miSalaActual).update({
                    estado: 'seleccion',
                    seleccion: { orden: lista, turnoActual: 0, personajesDisponibles: disp, opcionesActuales: disp.splice(0, 2) }
                });
            });
        }

        function seleccionarPersonaje(personaje) {
            miPersonajeAsignado = personaje;
            db.ref('salas/' + miSalaActual + '/seleccion').once('value').then((snapshot) => {
                let sel = snapshot.val();
                db.ref('salas/' + miSalaActual + '/jugadores').update({ [miNombre]: personaje });
                
                let descartado = sel.opcionesActuales.find(p => p !== personaje);
                if(descartado) sel.personajesDisponibles.push(descartado);
                
                let sigTurno = sel.turnoActual + 1;
                if (sigTurno >= sel.orden.length) {
                    db.ref('salas/' + miSalaActual).update({ estado: 'jugando' });
                } else {
                    sel.personajesDisponibles = sel.personajesDisponibles.sort(() => Math.random() - 0.5);
                    db.ref('salas/' + miSalaActual + '/seleccion').update({ turnoActual: sigTurno, personajesDisponibles: sel.personajesDisponibles, opcionesActuales: sel.personajesDisponibles.splice(0, 2) });
                }
            });
        }

        let motor3DIniciado = false; 

        function escucharCambiosSala(codigo) {
            db.ref('salas/' + codigo).on('value', (snapshot) => {
                const sala = snapshot.val();
                if(!sala) return;

                const lista = document.getElementById('lista-jugadores'); lista.innerHTML = ''; 
                for (let j in sala.jugadores) {
                    let rol = sala.jugadores[j] !== "Sin asignar" ? ` - <span style="color:${coloresPersonajes[sala.jugadores[j]]}">${sala.jugadores[j]}</span>` : '';
                    lista.innerHTML += `<li>${j}${rol}</li>`;
                }

                if (sala.estado === 'seleccion') {
                    document.getElementById('sala-espera').style.display = 'none';
                    document.getElementById('pantalla-seleccion').style.display = 'block';

                    const sel = sala.seleccion;
                    const jugadorTurno = sel.orden[sel.turnoActual];
                    const area = document.getElementById('area-seleccion');

                    if (jugadorTurno === miNombre) {
                        area.innerHTML = `<p style="color: #fff;">REQUIERE TU CONFIRMACIÓN DE ROL.</p>`;
                        sel.opcionesActuales.forEach(p => {
                            area.innerHTML += `<button style="color: ${coloresPersonajes[p]}; border-color: ${coloresPersonajes[p]};" onclick="seleccionarPersonaje('${p}')">${p}</button>`;
                        });
                    } else {
                        area.innerHTML = `<p class="texto-secundario" style="font-size: 16px; border: 1px solid rgba(51,255,51,0.3); padding: 20px;">ESPERANDO A QUE <b>${jugadorTurno}</b> ELIJA SU ROL...</p>`;
                    }
                    
                    const resumen = document.getElementById('resumen-elecciones');
                    resumen.innerHTML = "<b>ESTADO DE LA TRIPULACIÓN:</b><br>";
                    for (let j in sala.jugadores) {
                        let r = sala.jugadores[j];
                        if(r !== "Sin asignar") resumen.innerHTML += `${j}: <span style="color:${coloresPersonajes[r]}">${r}</span><br>`;
                    }
                } 
                else if (sala.estado === 'jugando') {
                    // Limpiamos la pantalla 2D y mostramos la de 100vw/100vh
                    document.getElementById('fondo-espacial').style.display = 'none';
                    document.getElementById('pantalla-seleccion').style.display = 'none';
                    document.getElementById('pantalla-juego').style.display = 'block';
                    
                    if (!motor3DIniciado) {
                        motor3DIniciado = true;
                        let colorFinal = coloresPersonajes[miPersonajeAsignado] || "#aaaaaa"; 
                        document.getElementById('info-rol').innerHTML = `IDENTIFICACIÓN: ${miNombre} | ROL: <span style="color:${colorFinal}">${miPersonajeAsignado || "Desconocido"}</span>`;
                        iniciarMotor3D();
                    }
                }
            });
        }

        // --- MOTOR 3D (PRIMERA PERSONA) ---
        function iniciarMotor3D() {
            const contenedor = document.getElementById('tablero-juego');
            
            // 1. Escena y Renderizador
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.Fog(0x020202, 10, 45); // Niebla oscura para dar ambiente

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            contenedor.appendChild(renderer.domElement);

            // 2. Luces
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);
            
            // Luz central verde
            const pointLight = new THREE.PointLight(0x33ff33, 1, 40); 
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            // 3. Crear la Habitación Cerrada (40x40)
            const materialSuelo = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const materialPared = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            
            // Suelo
            const suelo = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), materialSuelo);
            suelo.rotation.x = -Math.PI / 2;
            scene.add(suelo);
            
            // Rejilla del suelo para saber que te mueves
            const gridHelper = new THREE.GridHelper(40, 40, 0x114411, 0x051105);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Techo
            const techo = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), materialSuelo);
            techo.rotation.x = Math.PI / 2;
            techo.position.y = 15;
            scene.add(techo);

            // Paredes (Norte, Sur, Este, Oeste)
            const geomPared = new THREE.PlaneGeometry(40, 15);
            
            const pared1 = new THREE.Mesh(geomPared, materialPared);
            pared1.position.set(0, 7.5, -20);
            scene.add(pared1);

            const pared2 = new THREE.Mesh(geomPared, materialPared);
            pared2.position.set(0, 7.5, 20);
            pared2.rotation.y = Math.PI;
            scene.add(pared2);

            const pared3 = new THREE.Mesh(geomPared, materialPared);
            pared3.position.set(-20, 7.5, 0);
            pared3.rotation.y = Math.PI / 2;
            scene.add(pared3);

            const pared4 = new THREE.Mesh(geomPared, materialPared);
            pared4.position.set(20, 7.5, 0);
            pared4.rotation.y = -Math.PI / 2;
            scene.add(pared4);

            // 4. Puertas de compuerta en cada pared
            const geomPuerta = new THREE.PlaneGeometry(6, 10);
            const materialPuerta = new THREE.MeshLambertMaterial({ color: 0x550000 }); // Rojas oscuras

            const puerta1 = new THREE.Mesh(geomPuerta, materialPuerta);
            puerta1.position.set(0, 5, -19.9); // Pegada a la pared norte
            scene.add(puerta1);

            const puerta2 = new THREE.Mesh(geomPuerta, materialPuerta);
            puerta2.position.set(0, 5, 19.9);
            puerta2.rotation.y = Math.PI;
            scene.add(puerta2);

            const puerta3 = new THREE.Mesh(geomPuerta, materialPuerta);
            puerta3.position.set(-19.9, 5, 0);
            puerta3.rotation.y = Math.PI / 2;
            scene.add(puerta3);

            const puerta4 = new THREE.Mesh(geomPuerta, materialPuerta);
            puerta4.position.set(19.9, 5, 0);
            puerta4.rotation.y = -Math.PI / 2;
            scene.add(puerta4);

            // 5. Configurar Jugador / Cámara
            camera.position.set(0, 6, 0); // Altura de los ojos humanos
            camera.rotation.order = 'YXZ'; // Para que el ratón no rote la cámara en diagonal

            let yaw = 0; // Giro izquierda/derecha
            let pitch = 0; // Giro arriba/abajo
            const teclas = { w: false, a: false, s: false, d: false };
            const velocidad = 0.2;

            // Bloquear el ratón al hacer clic (Controles FPS)
            contenedor.addEventListener('click', () => {
                contenedor.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === contenedor) {
                    document.getElementById('instrucciones-3d').style.display = 'none';
                } else {
                    document.getElementById('instrucciones-3d').style.display = 'block';
                }
            });

            // Rotación con el ratón
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === contenedor) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    
                    // Limitar para que no pueda dar la vuelta a la cabeza hacia atrás
                    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
                    
                    camera.rotation.set(pitch, yaw, 0);
                }
            });

            // Capturar teclado
            window.addEventListener('keydown', (e) => {
                if(e.key.toLowerCase() === 'w') teclas.w = true;
                if(e.key.toLowerCase() === 'a') teclas.a = true;
                if(e.key.toLowerCase() === 's') teclas.s = true;
                if(e.key.toLowerCase() === 'd') teclas.d = true;
            });

            window.addEventListener('keyup', (e) => {
                if(e.key.toLowerCase() === 'w') teclas.w = false;
                if(e.key.toLowerCase() === 'a') teclas.a = false;
                if(e.key.toLowerCase() === 's') teclas.s = false;
                if(e.key.toLowerCase() === 'd') teclas.d = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const direccion = new THREE.Vector3();
            const derecha = new THREE.Vector3();

            // 6. Bucle de Animación
            function animar3D() {
                requestAnimationFrame(animar3D);

                // Calcular hacia dónde miramos para caminar hacia adelante
                camera.getWorldDirection(direccion);
                direccion.y = 0; // Para no volar al mirar hacia arriba
                direccion.normalize();
                derecha.crossVectors(camera.up, direccion).normalize();

                if (teclas.w) camera.position.addScaledVector(direccion, velocidad);
                if (teclas.s) camera.position.addScaledVector(direccion, -velocidad);
                if (teclas.a) camera.position.addScaledVector(derecha, -velocidad);
                if (teclas.d) camera.position.addScaledVector(derecha, velocidad);

                // COLISIONES: Mantener al jugador dentro de la sala (Rango de -19 a 19 para la sala de 40x40)
                camera.position.x = Math.max(-19, Math.min(19, camera.position.x));
                camera.position.z = Math.max(-19, Math.min(19, camera.position.z));
                camera.position.y = 6; // Mantener la altura constante

                renderer.render(scene, camera);
            }
            animar3D();
        }
    </script>
</body>
</html>
