<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemesis UMU - Terminal</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <style>
        body {
            background-color: #000;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita barras de desplazamiento */
        }

        /* Lienzo donde dibujaremos el espacio */
        #fondo-espacial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Efecto de monitor antiguo por encima de todo */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(51, 255, 51, 0.03) 2px, rgba(51, 255, 51, 0.03) 4px);
            pointer-events: none;
            z-index: 20;
        }

        .contenedor {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            padding: 30px;
            border: 1px solid #33ff33;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.3), inset 0 0 10px rgba(51, 255, 51, 0.1);
            text-align: center;
            width: 320px;
            position: relative;
            z-index: 10;
        }

        .contenedor::before {
            content: "SISTEMA MU-TH-UR 6000";
            position: absolute;
            top: -10px;
            left: 10px;
            background: #000;
            padding: 0 10px;
            font-size: 12px;
            color: #33ff33;
            border: 1px solid #33ff33;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: normal;
            border-bottom: 1px dashed #33ff33;
            padding-bottom: 10px;
            margin-top: 5px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 8px rgba(51, 255, 51, 0.5);
        }

        input::placeholder {
            color: rgba(51, 255, 51, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #33ff33;
            border: 1px solid #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #33ff33;
            color: #000;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.6);
        }

        .texto-secundario {
            font-size: 12px;
            color: rgba(51, 255, 51, 0.6);
            margin: 15px 0;
            text-transform: uppercase;
        }

        #sala-espera { display: none; }
        
        .codigo-destacado {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #33ff33;
            letter-spacing: 8px;
            margin: 15px 0;
        }

        #lista-jugadores {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            text-align: left;
            border: 1px solid rgba(51, 255, 51, 0.3);
            padding: 10px;
            min-height: 100px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        #lista-jugadores li {
            padding: 5px 0;
            font-size: 14px;
        }
        
        #lista-jugadores li::before {
            content: "> ";
        }
    </style>
</head>
<body>

    <!-- Lienzo animado para el espacio -->
    <canvas id="fondo-espacial"></canvas>

    <div class="contenedor" id="menu-principal">
        <h2>Acceso a Tripulación</h2>
        <input type="text" id="nombre-jugador" placeholder="IDENTIFICACIÓN" required autocomplete="off">
        
        <button onclick="crearSala()">INICIAR PROTOCOLO (Crear)</button>
        
        <div class="texto-secundario">--- O ACCEDE A UNA NAVE ---</div>
        
        <input type="text" id="codigo-input" placeholder="CÓDIGO DE ENLACE" maxlength="5" autocomplete="off">
        <button onclick="unirseSala()">CONECTAR</button>
    </div>

    <div class="contenedor" id="sala-espera">
        <h2>Protocolo Activo</h2>
        <p class="texto-secundario">CÓDIGO DE ENLACE TRANSMITIDO:</p>
        <div class="codigo-destacado" id="mostrar-codigo"></div>
        
        <p class="texto-secundario" style="text-align: left; margin-bottom: 5px;">TRIPULACIÓN DETECTADA:</p>
        <ul id="lista-jugadores">
            <!-- Los jugadores aparecen aquí -->
        </ul>
        
        <button style="margin-top: 20px;" onclick="empezarJuego()" id="btn-empezar">DESPERTAR DEL HIPERSUEÑO</button>
    </div>

    <script>
        // --- ANIMACIÓN DEL ESPACIO ---
        const canvas = document.getElementById('fondo-espacial');
        const ctx = canvas.getContext('2d');
        
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        // Crear estrellas
        const estrellas = [];
        for (let i = 0; i < 200; i++) {
            estrellas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radio: Math.random() * 1.5,
                velocidad: Math.random() * 0.5 + 0.1 // Efecto de profundidad
            });
        }

        const objetosEspaciales = [];

        function dibujarEspacio() {
            // Limpiar pantalla
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mover y dibujar estrellas
            ctx.fillStyle = '#ffffff';
            estrellas.forEach(estrella => {
                ctx.beginPath();
                ctx.arc(estrella.x, estrella.y, estrella.radio, 0, Math.PI * 2);
                ctx.fill();
                estrella.x -= estrella.velocidad;
                if (estrella.x < 0) {
                    estrella.x = canvas.width;
                    estrella.y = Math.random() * canvas.height;
                }
            });

            // Probabilidad de generar un asteroide o nave (1% por fotograma)
            if (Math.random() < 0.01) {
                const esNave = Math.random() > 0.8; // 20% naves, 80% asteroides
                objetosEspaciales.push({
                    tipo: esNave ? 'nave' : 'asteroide',
                    x: canvas.width + 50,
                    y: Math.random() * canvas.height,
                    velocidad: esNave ? Math.random() * 2 + 2 : Math.random() * 1 + 0.5,
                    tamaño: esNave ? 12 : Math.random() * 15 + 8
                });
            }

            // Dibujar y mover asteroides/naves
            for (let i = objetosEspaciales.length - 1; i >= 0; i--) {
                let obj = objetosEspaciales[i];
                obj.x -= obj.velocidad;

                if (obj.tipo === 'asteroide') {
                    // Cuerpo del asteroide
                    ctx.fillStyle = '#444';
                    ctx.beginPath();
                    ctx.arc(obj.x, obj.y, obj.tamaño, 0, Math.PI * 2);
                    ctx.fill();
                    // Cráter para darle textura
                    ctx.fillStyle = '#222';
                    ctx.beginPath();
                    ctx.arc(obj.x - obj.tamaño/3, obj.y - obj.tamaño/3, obj.tamaño/3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Nave (Triángulo apuntando a la izquierda)
                    ctx.fillStyle = '#778899';
                    ctx.beginPath();
                    ctx.moveTo(obj.x - obj.tamaño, obj.y);
                    ctx.lineTo(obj.x + obj.tamaño, obj.y - obj.tamaño/2);
                    ctx.lineTo(obj.x + obj.tamaño, obj.y + obj.tamaño/2);
                    ctx.fill();
                    // Propulsor de fuego
                    ctx.fillStyle = '#ff5500';
                    ctx.beginPath();
                    ctx.moveTo(obj.x + obj.tamaño, obj.y - obj.tamaño/4);
                    ctx.lineTo(obj.x + obj.tamaño + obj.tamaño/1.5, obj.y);
                    ctx.lineTo(obj.x + obj.tamaño, obj.y + obj.tamaño/4);
                    ctx.fill();
                }

                // Eliminar objeto si sale de la pantalla
                if (obj.x < -100) {
                    objetosEspaciales.splice(i, 1);
                }
            }

            requestAnimationFrame(dibujarEspacio);
        }
        dibujarEspacio();

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            databaseURL: "https://nemesis-54598-default-rtdb.firebaseio.com/" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- LÓGICA DEL JUEGO ---
        let miSalaActual = "";

        function generarCodigo() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let resultado = '';
            for (let i = 0; i < 5; i++) {
                resultado += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return resultado;
        }

        function mostrarLobbyUI(codigo) {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('sala-espera').style.display = 'block';
            document.getElementById('mostrar-codigo').innerText = codigo;
        }

        function crearSala() {
            const nombre = document.getElementById('nombre-jugador').value;
            if (!nombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");

            const codigo = generarCodigo();
            miSalaActual = codigo;
            
            db.ref('salas/' + codigo).set({
                creador: nombre,
                jugadores: {
                    [nombre]: true
                }
            });

            mostrarLobbyUI(codigo);
            escucharCambiosSala(codigo);
        }

        function unirseSala() {
            const nombre = document.getElementById('nombre-jugador').value;
            const codigo = document.getElementById('codigo-input').value.toUpperCase();
            
            if (!nombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");
            if (codigo.length !== 5) return alert("ERROR: CÓDIGO INVÁLIDO.");

            db.ref('salas/' + codigo).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    miSalaActual = codigo;
                    db.ref('salas/' + codigo + '/jugadores').update({
                        [nombre]: true
                    });
                    
                    mostrarLobbyUI(codigo);
                    escucharCambiosSala(codigo);
                } else {
                    alert("ERROR: NAVE NO ENCONTRADA.");
                }
            });
        }

        function escucharCambiosSala(codigo) {
            db.ref('salas/' + codigo + '/jugadores').on('value', (snapshot) => {
                const jugadores = snapshot.val();
                const lista = document.getElementById('lista-jugadores');
                
                lista.innerHTML = ''; 
                
                for (let jugador in jugadores) {
                    lista.innerHTML += `<li>${jugador} [EN LÍNEA]</li>`;
                }
            });
        }
        
        function empezarJuego() {
            alert("SISTEMA ALERTA: CRIOGENIA DESACTIVADA. PREPARANDO ENTORNO DE JUEGO...");
        }
    </script>
</body>
</html>
