<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemesis UMU - Terminal</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <style>
        body {
            /* Fondo fotográfico hiperrealista del espacio profundo */
            background-color: #000;
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Lienzo transparente para la animación */
        #fondo-espacial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Scanlines del monitor antiguo */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(51, 255, 51, 0.04) 2px, rgba(51, 255, 51, 0.04) 4px);
            pointer-events: none;
            z-index: 20;
        }

        .contenedor {
            background-color: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(4px);
            padding: 30px;
            border: 1px solid rgba(51, 255, 51, 0.6);
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.2), inset 0 0 15px rgba(51, 255, 51, 0.1);
            text-align: center;
            width: 320px;
            position: relative;
            z-index: 10;
        }

        .contenedor::before {
            content: "SISTEMA MU-TH-UR 6000";
            position: absolute;
            top: -10px;
            left: 10px;
            background: #000;
            padding: 0 10px;
            font-size: 12px;
            color: #33ff33;
            border: 1px solid #33ff33;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: normal;
            border-bottom: 1px dashed #33ff33;
            padding-bottom: 10px;
            margin-top: 5px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(51, 255, 51, 0.5);
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.4);
            border-color: #33ff33;
        }

        input::placeholder {
            color: rgba(51, 255, 51, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #33ff33;
            border: 1px solid #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background-color: rgba(51, 255, 51, 0.2);
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.5);
        }

        .texto-secundario {
            font-size: 12px;
            color: rgba(51, 255, 51, 0.6);
            margin: 15px 0;
            text-transform: uppercase;
        }

        #sala-espera { display: none; }
        
        .codigo-destacado {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 12px #33ff33;
            letter-spacing: 8px;
            margin: 15px 0;
        }

        #lista-jugadores {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            text-align: left;
            border: 1px solid rgba(51, 255, 51, 0.3);
            padding: 10px;
            min-height: 100px;
            background-color: rgba(0, 0, 0, 0.6);
        }

        #lista-jugadores li {
            padding: 5px 0;
            font-size: 14px;
        }
        
        #lista-jugadores li::before {
            content: "> ";
        }
    </style>
</head>
<body>

    <canvas id="fondo-espacial"></canvas>

    <div class="contenedor" id="menu-principal">
        <h2>Acceso a Tripulación</h2>
        <input type="text" id="nombre-jugador" placeholder="IDENTIFICACIÓN" required autocomplete="off">
        
        <button onclick="crearSala()">INICIAR PROTOCOLO (Crear)</button>
        
        <div class="texto-secundario">--- O ACCEDE A UNA NAVE ---</div>
        
        <input type="text" id="codigo-input" placeholder="CÓDIGO DE ENLACE" maxlength="5" autocomplete="off">
        <button onclick="unirseSala()">CONECTAR</button>
    </div>

    <div class="contenedor" id="sala-espera">
        <h2>Protocolo Activo</h2>
        <p class="texto-secundario">CÓDIGO DE ENLACE TRANSMITIDO:</p>
        <div class="codigo-destacado" id="mostrar-codigo"></div>
        
        <p class="texto-secundario" style="text-align: left; margin-bottom: 5px;">TRIPULACIÓN DETECTADA:</p>
        <ul id="lista-jugadores"></ul>
        
        <button style="margin-top: 20px;" onclick="empezarJuego()" id="btn-empezar">DESPERTAR DEL HIPERSUEÑO</button>
    </div>

    <script>
        // --- ANIMACIÓN REALISTA DEL ESPACIO Y ASTEROIDES 3D ---
        const canvas = document.getElementById('fondo-espacial');
        const ctx = canvas.getContext('2d');
        
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        // Generar estrellas parpadeantes
        const estrellas = [];
        for (let i = 0; i < 150; i++) {
            estrellas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radio: Math.random() * 1.2 + 0.3,
                velocidad: Math.random() * 0.15 + 0.05,
                opacidad: Math.random(),
                cambioOpacidad: (Math.random() * 0.01 + 0.005) * (Math.random() < 0.5 ? 1 : -1)
            });
        }

        const asteroides = [];

        function dibujarEspacio() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Estrellas parpadeantes
            estrellas.forEach(e => {
                e.opacidad += e.cambioOpacidad;
                if(e.opacidad <= 0.1) { e.opacidad = 0.1; e.cambioOpacidad *= -1; }
                if(e.opacidad >= 1) { e.opacidad = 1; e.cambioOpacidad *= -1; }
                
                ctx.fillStyle = `rgba(255, 255, 255, ${e.opacidad})`;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radio, 0, Math.PI * 2);
                ctx.fill();
                
                e.x -= e.velocidad;
                if (e.x < 0) {
                    e.x = canvas.width;
                    e.y = Math.random() * canvas.height;
                }
            });

            // Probabilidad de generar un asteroide gigante: 0.3% por fotograma
            if (Math.random() < 0.003) {
                let tamaño = Math.random() * 100 + 50; // Asteroides inmensos
                let obj = {
                    x: canvas.width + tamaño + 50,
                    y: Math.random() * canvas.height,
                    velocidad: Math.random() * 0.4 + 0.1, // Movimiento lento y pesado
                    tamaño: tamaño,
                    rotacion: Math.random() * Math.PI * 2,
                    velRotacion: (Math.random() - 0.5) * 0.005, // Rotación muy sutil
                    puntos: [],
                    crateres: []
                };

                // Generar geometría irregular
                let numPuntos = 15 + Math.floor(Math.random() * 10);
                for(let j=0; j<numPuntos; j++) {
                    let angulo = (j / numPuntos) * Math.PI * 2;
                    let radioVariado = obj.tamaño * (0.65 + Math.random() * 0.45); // Muy deforme
                    obj.puntos.push({x: Math.cos(angulo)*radioVariado, y: Math.sin(angulo)*radioVariado});
                }

                // Generar cráteres de textura
                let numCrateres = 15 + Math.floor(Math.random() * 15);
                for(let j=0; j<numCrateres; j++) {
                    obj.crateres.push({
                        x: (Math.random() - 0.5) * (obj.tamaño * 1.5),
                        y: (Math.random() - 0.5) * (obj.tamaño * 1.5),
                        r: Math.random() * (obj.tamaño/5) + 3
                    });
                }
                asteroides.push(obj);
            }

            // 2. Dibujar Asteroides Realistas
            for (let i = asteroides.length - 1; i >= 0; i--) {
                let obj = asteroides[i];
                obj.x -= obj.velocidad;
                obj.rotacion += obj.velRotacion;

                ctx.save();
                // Nos movemos al centro del asteroide
                ctx.translate(obj.x, obj.y);

                // ROTAMOS solo la geometría (forma de la roca)
                ctx.rotate(obj.rotacion);

                // Trazar la forma irregular
                ctx.beginPath();
                ctx.moveTo(obj.puntos[0].x, obj.puntos[0].y);
                for(let j=1; j<obj.puntos.length; j++) {
                    ctx.lineTo(obj.puntos[j].x, obj.puntos[j].y);
                }
                ctx.closePath();
                
                // CLIP: Todo lo que dibujemos a partir de aquí no se saldrá de la forma de la roca
                ctx.clip(); 

                // Color base rocoso profundo
                ctx.fillStyle = '#1e2428';
                ctx.fill();

                // Dibujar la textura (cráteres) rotando junto a la roca
                obj.crateres.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
                    ctx.fillStyle = '#15191c';
                    ctx.fill();
                    ctx.strokeStyle = '#0a0d0e';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                });

                // TRUCO 3D: Des-rotamos el lienzo ANTES de aplicar la luz.
                // Así, la luz cálida siempre golpea desde arriba a la derecha, sin importar cómo gire la roca.
                ctx.rotate(-obj.rotacion);

                // Luz direccional hiperrealista (imita la imagen)
                let luz = ctx.createRadialGradient(obj.tamaño*0.5, -obj.tamaño*0.5, 0, 0, 0, obj.tamaño*1.5);
                luz.addColorStop(0, 'rgba(255, 170, 100, 0.65)'); // Luz cálida/naranja
                luz.addColorStop(0.3, 'rgba(0, 0, 0, 0)');        // Centro neutro
                luz.addColorStop(0.7, 'rgba(0, 0, 0, 0.85)');     // Sombra profunda a la izquierda
                luz.addColorStop(1, 'rgba(0, 0, 0, 0.98)');       // Oscuridad absoluta

                ctx.fillStyle = luz;
                ctx.fillRect(-obj.tamaño*2, -obj.tamaño*2, obj.tamaño*4, obj.tamaño*4);

                // Restaurar el lienzo original
                ctx.restore();

                // Eliminar el asteroide si ya no se ve
                if (obj.x < -obj.tamaño * 2) asteroides.splice(i, 1);
            }
            requestAnimationFrame(dibujarEspacio);
        }
        dibujarEspacio();

        // --- LÓGICA DE FIREBASE ---
        const firebaseConfig = {
            databaseURL: "https://nemesis-54598-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let miSalaActual = "";

        function generarCodigo() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let resultado = '';
            for (let i = 0; i < 5; i++) resultado += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            return resultado;
        }

        function mostrarLobbyUI(codigo) {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('sala-espera').style.display = 'block';
            document.getElementById('mostrar-codigo').innerText = codigo;
        }

        function crearSala() {
            const nombre = document.getElementById('nombre-jugador').value;
            if (!nombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");
            const codigo = generarCodigo();
            miSalaActual = codigo;
            db.ref('salas/' + codigo).set({ creador: nombre, jugadores: { [nombre]: true } });
            mostrarLobbyUI(codigo);
            escucharCambiosSala(codigo);
        }

        function unirseSala() {
            const nombre = document.getElementById('nombre-jugador').value;
            const codigo = document.getElementById('codigo-input').value.toUpperCase();
            if (!nombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");
            if (codigo.length !== 5) return alert("ERROR: CÓDIGO INVÁLIDO.");
            db.ref('salas/' + codigo).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    miSalaActual = codigo;
                    db.ref('salas/' + codigo + '/jugadores').update({ [nombre]: true });
                    mostrarLobbyUI(codigo);
                    escucharCambiosSala(codigo);
                } else alert("ERROR: NAVE NO ENCONTRADA.");
            });
        }

        function escucharCambiosSala(codigo) {
            db.ref('salas/' + codigo + '/jugadores').on('value', (snapshot) => {
                const jugadores = snapshot.val();
                const lista = document.getElementById('lista-jugadores');
                lista.innerHTML = ''; 
                for (let jugador in jugadores) lista.innerHTML += `<li>${jugador} [EN LÍNEA]</li>`;
            });
        }
        
        function empezarJuego() {
            alert("SISTEMA ALERTA: CRIOGENIA DESACTIVADA. PREPARANDO ENTORNO DE JUEGO...");
        }
    </script>
</body>
</html>
