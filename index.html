<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemesis UMU - Terminal</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <style>
        body {
            background-color: #000;
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #fondo-espacial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(51, 255, 51, 0.04) 2px, rgba(51, 255, 51, 0.04) 4px);
            pointer-events: none;
            z-index: 20;
        }

        .contenedor {
            background-color: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(4px);
            padding: 30px;
            border: 1px solid rgba(51, 255, 51, 0.6);
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.2), inset 0 0 15px rgba(51, 255, 51, 0.1);
            text-align: center;
            width: 320px;
            position: relative;
            z-index: 10;
        }

        .contenedor::before {
            content: "SISTEMA OR - I - U600";
            position: absolute;
            top: -10px;
            left: 10px;
            background: #000;
            padding: 0 10px;
            font-size: 12px;
            color: #33ff33;
            border: 1px solid #33ff33;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: normal;
            border-bottom: 1px dashed #33ff33;
            padding-bottom: 10px;
            margin-top: 5px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(51, 255, 51, 0.5);
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #33ff33;
            border: 1px solid #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background-color: rgba(51, 255, 51, 0.2);
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.5);
        }

        .texto-secundario {
            font-size: 12px;
            color: rgba(51, 255, 51, 0.6);
            margin: 15px 0;
        }

        #sala-espera { display: none; }
        
        .codigo-destacado {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 12px #33ff33;
            letter-spacing: 8px;
            margin: 15px 0;
        }

        #lista-jugadores {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            text-align: left;
            border: 1px solid rgba(51, 255, 51, 0.3);
            padding: 10px;
            min-height: 100px;
            background-color: rgba(0, 0, 0, 0.6);
        }

        #lista-jugadores li::before { content: "> "; }
    </style>
</head>
<body>

    <canvas id="fondo-espacial"></canvas>

    <div class="contenedor" id="menu-principal">
        <h2>Acceso a Tripulación</h2>
        <input type="text" id="nombre-jugador" placeholder="IDENTIFICACIÓN" required autocomplete="off">
        <button onclick="crearSala()">INICIAR PROTOCOLO (Crear)</button>
        <div class="texto-secundario">--- O ACCEDE A UNA NAVE ---</div>
        <input type="text" id="codigo-input" placeholder="CÓDIGO DE ENLACE" maxlength="5" autocomplete="off">
        <button onclick="unirseSala()">CONECTAR</button>
    </div>

    <div class="contenedor" id="sala-espera">
        <h2>Protocolo Activo</h2>
        <p class="texto-secundario">CÓDIGO DE ENLACE TRANSMITIDO:</p>
        <div class="codigo-destacado" id="mostrar-codigo"></div>
        <p class="texto-secundario" style="text-align: left; margin-bottom: 5px;">TRIPULACIÓN DETECTADA:</p>
        <ul id="lista-jugadores"></ul>
        <button style="margin-top: 20px;" onclick="empezarJuego()" id="btn-empezar">DESPERTAR DEL HIPERSUEÑO</button>
    </div>

    <script>
        // --- 1. CARGAR LAS IMÁGENES ---
        const imgAsteroide = new Image();
        // Cámbialo a 'mi-asteroide.png' si subiste tu propia imagen a GitHub
        imgAsteroide.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Asteroid_Ida.png/480px-Asteroid_Ida.png'; 

        const imgNave1 = new Image(); imgNave1.src = 'nave1.png';
        const imgNave2 = new Image(); imgNave2.src = 'nave2.png';
        const imgNave3 = new Image(); imgNave3.src = 'nave3.png';

        const canvas = document.getElementById('fondo-espacial');
        const ctx = canvas.getContext('2d');
        
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        const estrellas = [];
        for (let i = 0; i < 150; i++) {
            estrellas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radio: Math.random() * 1.2 + 0.3,
                velocidad: Math.random() * 0.15 + 0.05,
                opacidad: Math.random(),
                cambioOpacidad: (Math.random() * 0.01 + 0.005) * (Math.random() < 0.5 ? 1 : -1)
            });
        }

        const asteroides = [];
        const naves = [];

        function dibujarEspacio() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- ESTRELLAS ---
            estrellas.forEach(e => {
                e.opacidad += e.cambioOpacidad;
                if(e.opacidad <= 0.1) { e.opacidad = 0.1; e.cambioOpacidad *= -1; }
                if(e.opacidad >= 1) { e.opacidad = 1; e.cambioOpacidad *= -1; }
                
                ctx.fillStyle = `rgba(255, 255, 255, ${e.opacidad})`;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radio, 0, Math.PI * 2);
                ctx.fill();
                
                e.x -= e.velocidad;
                if (e.x < 0) { e.x = canvas.width; e.y = Math.random() * canvas.height; }
            });

            // --- GENERAR ASTEROIDES (Probabilidad aumentada al 2%) ---
            if (imgAsteroide.complete && Math.random() < 0.02) {
                asteroides.push({
                    x: canvas.width + 150,
                    y: Math.random() * canvas.height,
                    velocidad: Math.random() * 1.5 + 0.5, // Un poco más rápidos
                    tamaño: Math.random() * 150 + 80,
                    rotacion: Math.random() * Math.PI * 2,
                    velRotacion: (Math.random() - 0.5) * 0.02
                });
            }

            // --- GENERAR NAVES (Probabilidad del 0.3%) ---
            if (Math.random() < 0.003) {
                let tipoNave = Math.floor(Math.random() * 3) + 1;
                let tamañoNave = Math.random() * 60 + 40;

                if (tipoNave === 1 && imgNave1.complete) {
                    naves.push({ tipo: 1, x: canvas.width + 100, y: Math.random() * canvas.height, velocidadX: -(Math.random() * 2 + 1), tamaño: tamañoNave, opacidad: 1 });
                } else if (tipoNave === 2 && imgNave2.complete) {
                    naves.push({ tipo: 2, x: -100, y: Math.random() * canvas.height, velocidadX: Math.random() * 2 + 1, tamaño: tamañoNave, opacidad: 1 });
                } else if (tipoNave === 3 && imgNave3.complete) {
                    naves.push({ tipo: 3, x: Math.random() * (canvas.width - 200) + 100, y: Math.random() * (canvas.height - 200) + 100, velocidadX: (Math.random() - 0.5) * 0.2, tamaño: tamañoNave, opacidad: 0, faseBlink: 'apareciendo' });
                }
            }

            // --- DIBUJAR ASTEROIDES ---
            for (let i = asteroides.length - 1; i >= 0; i--) {
                let obj = asteroides[i];
                obj.x -= obj.velocidad;
                obj.rotacion += obj.velRotacion;

                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.rotacion);
                ctx.drawImage(imgAsteroide, -obj.tamaño / 2, -obj.tamaño / 2, obj.tamaño, obj.tamaño);
                ctx.restore();

                if (obj.x < -300) asteroides.splice(i, 1);
            }

            // --- DIBUJAR NAVES ---
            for (let i = naves.length - 1; i >= 0; i--) {
                let nave = naves[i];
                nave.x += nave.velocidadX;

                ctx.save();
                ctx.translate(nave.x, nave.y);

                let imagenActual;
                if (nave.tipo === 1) imagenActual = imgNave1;
                else if (nave.tipo === 2) imagenActual = imgNave2;
                else if (nave.tipo === 3) {
                    imagenActual = imgNave3;
                    if (nave.faseBlink === 'apareciendo') {
                        nave.opacidad += 0.005;
                        if (nave.opacidad >= 1) nave.faseBlink = 'desapareciendo';
                    } else {
                        nave.opacidad -= 0.005;
                    }
                    ctx.globalAlpha = Math.max(0, Math.min(1, nave.opacidad));
                }

                if (imagenActual && imagenActual.complete) {
                    ctx.drawImage(imagenActual, -nave.tamaño / 2, -nave.tamaño / 2, nave.tamaño, nave.tamaño);
                }

                ctx.restore();

                if (nave.tipo === 1 && nave.x < -200) naves.splice(i, 1); 
                else if (nave.tipo === 2 && nave.x > canvas.width + 200) naves.splice(i, 1); 
                else if (nave.tipo === 3 && nave.faseBlink === 'desapareciendo' && nave.opacidad <= 0) naves.splice(i, 1); 
            }

            requestAnimationFrame(dibujarEspacio);
        }
        dibujarEspacio();

        // --- LÓGICA DE FIREBASE ---
        const firebaseConfig = { databaseURL: "https://nemesis-54598-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let miSalaActual = "";

        function generarCodigo() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let resultado = '';
            for (let i = 0; i < 5; i++) resultado += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            return resultado;
        }

        function mostrarLobbyUI(codigo) {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('sala-espera').style.display = 'block';
            document.getElementById('mostrar-codigo').innerText = codigo;
        }

        function crearSala() {
            const nombre = document.getElementById('nombre-jugador').value;
            if (!nombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");
            const codigo = generarCodigo();
            miSalaActual = codigo;
            db.ref('salas/' + codigo).set({ creador: nombre, jugadores: { [nombre]: true } });
            mostrarLobbyUI(codigo);
            escucharCambiosSala(codigo);
        }

        function unirseSala() {
            const nombre = document.getElementById('nombre-jugador').value;
            const codigo = document.getElementById('codigo-input').value.toUpperCase();
            if (!nombre) return alert("ERROR: IDENTIFICACIÓN REQUERIDA.");
            if (codigo.length !== 5) return alert("ERROR: CÓDIGO INVÁLIDO.");
            db.ref('salas/' + codigo).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    miSalaActual = codigo;
                    db.ref('salas/' + codigo + '/jugadores').update({ [nombre]: true });
                    mostrarLobbyUI(codigo);
                    escucharCambiosSala(codigo);
                } else alert("ERROR: NAVE NO ENCONTRADA.");
            });
        }

        function escucharCambiosSala(codigo) {
            db.ref('salas/' + codigo + '/jugadores').on('value', (snapshot) => {
                const jugadores = snapshot.val();
                const lista = document.getElementById('lista-jugadores');
                lista.innerHTML = ''; 
                for (let jugador in jugadores) lista.innerHTML += `<li>${jugador} [EN LÍNEA]</li>`;
            });
        }
        
        function empezarJuego() {
            alert("SISTEMA ALERTA: CRIOGENIA DESACTIVADA. PREPARANDO ENTORNO DE JUEGO...");
        }
    </script>
</body>
</html>
